<!--
  DAFQLY transactional email header.
  Usage: paste this table at the top of the email <body>, above the content table.
  IMPORTANT: email clients cannot load a relative image from an email. Before sending,
  either (a) host email-header.png at a public HTTPS URL and replace the src below with
  that absolute URL, or (b) embed it as a CID inline attachment referenced as
  src="cid:dafqly-header". The relative src here is for in-repo previews/templates only.
  Keep the width/height attributes (600x120 display size, 2x asset) — Outlook needs them.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0;padding:0;background-color:#ffffff;">
  <tr>
    <td align="left" style="padding:0;margin:0;font-size:0;line-height:0;">
      <img src="email-header.png" alt="DAFQLY — Track. Follow. Get Paid." width="600" height="120" style="display:block;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;" />
    </td>
  </tr>
</table>
